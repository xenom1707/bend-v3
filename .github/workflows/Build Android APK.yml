name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/android-tools
            mkdir -p /tmp/android-tools
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
            cp -R /tmp/android-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android 35
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project
        shell: bash
        run: |
          cat build.gradle.kts
          cat settings.gradle.kts
          cat app/build.gradle.kts
          test -f app/src/main/assets/index.html

      - name: Build APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk BendCalculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BendCalculator-APK
          path: BendCalculator.apk
          if-no-files-found: error
          retention-days: 30
